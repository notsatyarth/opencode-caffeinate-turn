name: Release (disabled in fork)

# Upstream publishes to npm as `opencode-caffeinate` using NPM_TOKEN. This fork is
# distributed from GitHub only, so publishing is intentionally disabled. If you
# re-enable it: pin actions by SHA, pass inputs through `env:`, never `git push --force`,
# and use `gh release create` instead of the deprecated actions/create-release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Release workflow is disabled in this fork."
